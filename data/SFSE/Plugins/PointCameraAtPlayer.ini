[Settings]
; 0 = legacy manual target/rebuild switching
; 1 = legacy automatic target/rebuild switching
; 2 = experimental visual-isolated automatic mode
;
; Mode 2 keeps Starfield's native dialogue target on the NPC at all times.
; The player shot is produced only by overriding the rendered camera transform
; after Starfield has completed its native dialogue update.
iSwitchMode=2

; Windows virtual-key codes: V = 86, X = 88
iManualSwitchKey=86
iExpressionCycleKey=88

; Automatic switching timing
; Player view waits for stable silence so gaps between NPC voice fragments do
; not create rapid cuts. In mode 2, returning to the NPC uses only npcDelay
; because no native dialogue state is modified.
iAutoPlayerDelayMs=250
iAutoNpcDelayMs=60
iAutoNpcSpeechLeadMs=2000
iAutoNpcHoldMs=900
iAutoStartupGraceMs=350

; Visual-isolated player-shot framing. The camera is placed between the actors,
; offset to whichever side gives better clearance around the NPC, then rotated
; toward the player. This is camera-only and performs no NPC visibility writes.
iVisualCameraDistancePercent=38
iVisualCameraMinDistance=34
iVisualCameraMaxDistance=82
iVisualCameraSideOffset=30
iVisualCameraVerticalOffset=2
iVisualCameraAimHeightPercent=55

; Fixed third-person warm-up used only when dialogue opens.
iDialogueOpenCameraDelayMs=350
iForceSheatheOnDialogue=1
iForceThirdPersonOnDialogue=1

; Used only by legacy modes 0/1. Mode 2 never retargets the native dialogue
; controller or resolver.
iSuppressCameraRecentering=1

; Expression controls
iFunMode=0
sDefaultExpression=
iExpressionApplyDelayMs=120
iExpressionNotifications=1
iExpressionNotificationDurationMs=1400
